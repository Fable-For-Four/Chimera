name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.11" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      # Only real errors block a PR (syntax, undefined names), not style.
      - run: ruff check --select E9,F63,F7,F82 .
      # Exit code 5 means no tests were collected yet, which is fine on an early branch.
      - run: python -m pytest -q || [ $? -eq 5 ]
        shell: bash

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until web/ exists
        id: has_web
        shell: bash
        run: echo "present=$([ -f web/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has_web.outputs.present == 'yes'
        with:
          node-version: 20
      - if: steps.has_web.outputs.present == 'yes'
        run: npm ci && npm run lint && npm run build
        working-directory: web
